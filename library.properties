sentence=A high-performance servo control library for ESP32, ESP8266, nRF52/nRF53, RP2040, STM32, AVR, UNO R4, UNO Q, and Mbed boards.
paragraph=RoboServo provides easy-to-use functions for controlling multiple servos on ESP32 variants, ESP8266, ArduinoNRF nRF52/nRF53 boards, Adafruit/Nordic DK cores, RP2040/RP2350, STM32, AVR (UNO/Nano/Mega), Arduino UNO R4, Arduino UNO Q, and Mbed boards such as Nano 33 BLE. Features include support for 180/270/360 degree servos, grouped servo control, configurable rotation ranges and frequencies (40-400Hz), automatic GPIO validation per variant, and optimized PWM generation with intelligent channel management.
category=Device Control
